name: Manutenção — Varredura Sob Demanda

# Sem schedule: a manutenção é MANUAL por decisão. Rode por "Run workflow" aqui
# no Actions quando quiser um raio-x do sistema, ou localmente com
# `npm run manutencao`. O resultado sai no log do job.
#
# Havia um cron diário com envio de e-mail via Resend. Foi removido: a chave
# quebrou duas vezes em três dias e o job ficava vermelho por causa do
# mensageiro, não do sistema vigiado — alarme que só falava de si mesmo.
on:
  workflow_dispatch:

concurrency:
  group: manutencao
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pra ler o histórico de execuções dos outros workflows via API e descobrir
      # POR QUE quebrou, não só o que quebrou.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run manutencao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Só é usada quando a checagem SQL já encontrou algo — rodar num dia
          # limpo não gasta token.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
